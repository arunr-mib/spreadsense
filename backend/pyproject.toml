[project]
name = "spreadsense-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5.0",  # bcrypt 5.x removed __about__ breaking passlib
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "aiofiles>=23.0",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

# Without this, `pip install -e .` fails outright: setuptools' flat-layout
# auto-discovery sees `app/` and `migrations/` as two top-level packages and
# refuses to guess which one(s) belong in the distribution. The Dockerfile
# never hit this — it installs before `COPY backend/ ./` adds `migrations/`,
# so only `app/` existed yet. CI checks out the whole repo first, so
# `pip install -e .` always saw both and always failed before a single test
# ran. `app` is the only thing this package needs to ship.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
